    <script>
        class BobloxInterface {
            constructor() {
                this.shapes = [];
                this.canvas = document.getElementById('canvas');
                this.chatMessages = document.getElementById('chat-messages');

                this.init();
                this.setupEventListeners();
            }

            init() {
                this.resizeCanvas();
                setTimeout(() => {
                    this.addChatMessage('System', 'Boblox Physics Engine Ready!');
                }, 1000);
            }

            setupEventListeners() {
                document.getElementById('add-shape').addEventListener('click', () => {
                    const shape = {
                        type: 'cube',
                        id: Date.now(),
                        name: `cube_${this.shapes.length + 1}`
                    };
                    this.shapes.push(shape);
                    this.addChatMessage('System', `Added ${shape.name}`);
                });

                document.getElementById('embed-scene').addEventListener('click', () => {
                    const sceneData = {
                        shapes: this.shapes,
                        timestamp: Date.now(),
                        version: "Boblox 2008 Web"
                    };
                    this.downloadJSON(sceneData, `embedded_scene_${sceneData.timestamp}.json`);
                    this.addChatMessage('System', 'Scene embedded!');
                });
            }

            addChatMessage(sender, message) {
                const messageDiv = document.createElement('div');
                messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
                this.chatMessages.appendChild(messageDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollTop;
            }

            downloadJSON(data, filename) {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.clientWidth;
                this.canvas.height = this.canvas.clientHeight;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new BobloxInterface();
        });
    </script>

    <script src="web/physics.js"></script>
    <script>
        class BobloxInterface {
            constructor() {
                this.shapes = [];
                this.canvas = document.getElementById('canvas');
                this.chatMessages = document.getElementById('chat-messages');
                this.physicsModule = null;

                this.init();
                this.setupEventListeners();
            }

            async init() {
                try {
                    // Load WebAssembly module
                    this.physicsModule = await Module();
                    
                    // Initialize physics
                    this.physicsModule.ccall('initPhysics', null, [], []);
                    
                    this.resizeCanvas();
                    this.addChatMessage('System', 'Boblox Physics Engine Ready!');
                    this.addChatMessage('System', 'WebAssembly physics loaded successfully!');
                    
                    // Start render loop
                    this.startRenderLoop();
                } catch (error) {
                    console.error('Failed to load WebAssembly:', error);
                    this.addChatMessage('System', 'WebAssembly failed to load - using JavaScript fallback');
                    this.resizeCanvas();
                    this.startRenderLoop();
                }
            }

            setupEventListeners() {
                document.getElementById('add-shape').addEventListener('click', () => {
                    this.addShape();
                });

                document.getElementById('embed-scene').addEventListener('click', () => {
                    this.embedScene();
                });
            }

            addShape() {
                const shape = {
                    type: 'cube',
                    position: { x: 0, y: 10, z: 0 },
                    size: { x: 2, y: 2, z: 2 },
                    mass: 1.0,
                    material: 'plastic',
                    id: Date.now(),
                    name: `cube_${this.shapes.length + 1}`
                };
                
                this.shapes.push(shape);
                
                // Add to WebAssembly physics if available
                if (this.physicsModule) {
                    const bodyId = this.physicsModule.ccall(
                        'addPhysicsBody', 
                        'number',
                        ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'string', 'string'],
                        [shape.position.x, shape.position.y, shape.position.z,
                         shape.size.x, shape.size.y, shape.size.z,
                         shape.mass, shape.type, shape.material]
                    );
                    shape.bodyId = bodyId;
                }
                
                this.addChatMessage('System', `Added ${shape.name} (${shape.material})`);
            }

            embedScene() {
                const sceneData = {
                    shapes: this.shapes,
                    timestamp: Date.now(),
                    version: "Boblox 2008 Web",
                    physicsBodies: this.physicsModule ? this.physicsModule.ccall('getBodyCount', 'number', [], []) : 0
                };
                
                const filename = `embedded_scene_${sceneData.timestamp}.json`;
                this.downloadJSON(sceneData, filename);
                this.addChatMessage('System', `Scene embedded as ${filename}!`);
                
                // Also call WebAssembly embed if available
                if (this.physicsModule) {
                    this.physicsModule.ccall('embedScene', null, ['string'], [filename]);
                }
            }

            addChatMessage(sender, message) {
                const messageDiv = document.createElement('div');
                messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
                this.chatMessages.appendChild(messageDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollTop;
            }

            downloadJSON(data, filename) {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.clientWidth;
                this.canvas.height = this.canvas.clientHeight;
            }

            startRenderLoop() {
                const render = () => {
                    this.render();
                    requestAnimationFrame(render);
                };
                render();
            }

            render() {
                const gl = this.canvas.getContext('webgl') || this.canvas.getContext('experimental-webgl');
                if (!gl) return;

                // Clear canvas
                gl.clearColor(0.5, 0.7, 1.0, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                // Simulate physics if WebAssembly is loaded
                if (this.physicsModule) {
                    this.physicsModule.ccall('simulatePhysics', null, ['number'], [1/60]); // 60 FPS
                    
                    // Update shape positions from physics
                    const bodyCount = this.physicsModule.ccall('getBodyCount', 'number', [], []);
                    for (let i = 0; i < bodyCount && i < this.shapes.length; i++) {
                        const dataPtr = this.physicsModule._malloc(6 * 4); // 6 floats * 4 bytes
                        this.physicsModule.ccall('getBodyData', null, ['number', 'number'], [i, dataPtr]);
                        
                        const data = new Float32Array(this.physicsModule.HEAPF32.buffer, dataPtr, 6);
                        this.shapes[i].position.x = data[0];
                        this.shapes[i].position.y = data[1];
                        this.shapes[i].position.z = data[2];
                        
                        this.physicsModule._free(dataPtr);
                    }
                }

                // Simple render - draw shapes as colored rectangles
                this.shapes.forEach((shape, index) => {
                    // Placeholder rendering - in a real implementation you'd use proper 3D rendering
                    // For now, just log positions
                    if (index === 0 && Math.random() < 0.01) { // Log occasionally
                        console.log(`Shape ${shape.name}: (${shape.position.x.toFixed(2)}, ${shape.position.y.toFixed(2)}, ${shape.position.z.toFixed(2)})`);
                    }
                });
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new BobloxInterface();
        });
    </script>
